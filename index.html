<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeakGallery Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .search-section { text-align: center; margin-bottom: 30px; padding: 20px 0; }
        .search-box { display: flex; justify-content: center; gap: 10px; }
        .search-box input {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-size: 1rem;
            width: 300px;
            outline: none;
        }
        .search-box input:focus { outline: 2px solid #444; }
        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background-color: #ff5555;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .search-box button:hover { background-color: #ff3333; }
        header { text-align: center; margin-bottom: 30px; padding: 20px 0; border-bottom: 1px solid #333; }
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .profile-banner { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #444; object-fit: cover; }
        .profile-info { text-align: center; }
        .profile-info h1 { font-size: 2rem; margin-bottom: 5px; }
        .profile-info p { color: #aaa; margin: 5px 0; }
        .stats { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-item .number { font-weight: bold; font-size: 1.2rem; }
        .stat-item .label { font-size: 0.9rem; color: #aaa; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .media-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .media-card:hover { transform: scale(1.02); }
        .media-thumbnail { width: 100%; height: 200px; object-fit: cover; }
        .media-info { padding: 10px; }
        .media-type { font-size: 0.8rem; color: #ff5555; margin-bottom: 5px; }
        .media-date { font-size: 0.8rem; color: #aaa; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            overflow: auto;
        }
        .modal-content { margin: 2% auto; display: block; max-width: 80%; max-height: 80%; }
        .modal-video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
        .modal-image { display: none; max-width: 80%; max-height: 70vh; margin: 0 auto; border-radius: 8px; }
        .close { position: absolute; top: 30px; right: 50px; color: #f1f1f1; font-size: 50px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #bbb; }
        .loading { text-align: center; padding: 20px; font-size: 1.2rem; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .pagination button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #ff5555;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .pagination button:hover { background-color: #ff3333; }
        .pagination button:disabled { background-color: #444; cursor: not-allowed; }
        @media (max-width: 768px) {
            .gallery { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
            .search-box { flex-direction: column; align-items: center; }
            .search-box input { width: 100%; max-width: 400px; }
        }
        @media (max-width: 480px) {
            .gallery { grid-template-columns: 1fr; }
            .modal-content { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="usernameInput" placeholder="Enter Username" value="mihye024">
                <button onclick="searchUser()">Search</button>
            </div>
        </div>

        <header>
            <div class="profile-header">
                <img id="profile-banner" class="profile-banner" src="" alt="Banner">
                <img id="profile-pic" class="profile-pic" src="" alt="Profile Picture">
                <div class="profile-info">
                    <h1 id="username"></h1>
                    <p id="old-usernames"></p>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="number" id="subscribers">0</div>
                            <div class="label">Subscribers</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="views">0</div>
                            <div class="label">Views</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="total-media">0</div>
                            <div class="label">Media</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="gallery" id="gallery">
            <div class="loading">Enter a username to load gallery.</div>
        </div>

        <div class="pagination">
            <button id="prevPage" onclick="changePage(-1)">Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage" onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div id="mediaModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <video id="modalVideo" class="modal-video" controls autoplay muted loop></video>
            <img id="modalImage" class="modal-image" src="" alt="Media">
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentUsername = 'mihye024';

        const apiUrl = 'https://betadash-api-swordslush-production.up.railway.app/leakgallery';
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('mediaModal');
        const modalVideo = document.getElementById('modalVideo');
        const modalImage = document.getElementById('modalImage');
        const usernameInput = document.getElementById('usernameInput');
        const prevPageBtn = document.getElementById('prevPage');
        const nextPageBtn = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');

        async function fetchData(username, page = 1) {
            try {
                gallery.innerHTML = '<div class="loading">Loading gallery...</div>';
                const response = await fetch(`${apiUrl}?username=${username}&page=${page}`);
                const data = await response.json();

                if (data.status) {
                    updateProfile(data.profile);
                    displayMedia(data.medias);
                    updatePagination(data.profile.total_pages, page);
                } else {
                    gallery.innerHTML = '<div class="loading">No data found for this user.</div>';
                }
            } catch (error) {
                gallery.innerHTML = '<div class="loading">Error loading data. Please try again later.</div>';
                console.error('Error:', error);
            }
        }

        function updateProfile(profile) {
            document.getElementById('username').textContent = profile.username;
            document.getElementById('old-usernames').textContent = profile.old_usernames || '';
            document.getElementById('profile-pic').src = profile.profile_pic || 'https://via.placeholder.com/120';
            document.getElementById('profile-banner').src = profile.banner || profile.profile_pic || 'https://via.placeholder.com/1200x300';
            document.getElementById('subscribers').textContent = profile.subscribers.toLocaleString();
            document.getElementById('views').textContent = profile.views.toLocaleString();
            document.getElementById('total-media').textContent = profile.total_media.toLocaleString();
        }

        function displayMedia(medias) {
            gallery.innerHTML = '';
            if (medias.length === 0) {
                gallery.innerHTML = '<div class="loading">No media found for this page.</div>';
                return;
            }

            medias.forEach(media => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openModal(media);

                const thumbnail = document.createElement('img');
                thumbnail.className = 'media-thumbnail';
                thumbnail.src = media.thumbnail || 'https://via.placeholder.com/300x200';
                thumbnail.alt = media.type;

                const info = document.createElement('div');
                info.className = 'media-info';

                const type = document.createElement('div');
                type.className = 'media-type';
                type.textContent = media.type.toUpperCase();

                const date = document.createElement('div');
                date.className = 'media-date';
                date.textContent = new Date(media.added).toLocaleDateString();

                info.appendChild(type);
                info.appendChild(date);

                card.appendChild(thumbnail);
                card.appendChild(info);

                gallery.appendChild(card);
            });
        }

        function openModal(media) {
            modal.style.display = 'block';

            if (media.type === 'video') {
                modalVideo.style.display = 'block';
                modalImage.style.display = 'none';
                modalVideo.src = media.url;
                modalVideo.load();
            } else {
                modalVideo.style.display = 'none';
                modalImage.style.display = 'block';
                modalImage.src = media.url;
            }
        }

        function closeModal() {
            modal.style.display = 'none';
            modalVideo.pause();
            modalVideo.currentTime = 0;
        }

        function searchUser() {
            currentUsername = usernameInput.value.trim();
            if (currentUsername) {
                currentPage = 1;
                fetchData(currentUsername, currentPage);
            }
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                fetchData(currentUsername, currentPage);
            }
        }

        function updatePagination(total, current) {
            totalPages = total;
            pageInfo.textContent = `Page ${current} of ${total}`;
            prevPageBtn.disabled = current <= 1;
            nextPageBtn.disabled = current >= total;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchData(currentUsername, currentPage);
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUser();
        });
    </script>
</body>
</html>
