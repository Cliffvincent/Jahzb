<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Music — Song Finder & Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: {
        brand: { pink: '#fa233b', red: '#ff2d55', deep: '#070708', card: '#161618' }
      }
    }
  }
}
</script>
<style>
*{ -webkit-tap-highlight-color: transparent; }
body{
  background:
    radial-gradient(1000px 500px at 80% -10%, rgba(250,35,59,.14), transparent 60%),
    radial-gradient(800px 400px at -10% 20%, rgba(255,45,85,.08), transparent 55%),
    #070708;
  color:#f5f5f7;
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.nav-blur{
  background:rgba(14,14,16,.82);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.song-card{
  background:linear-gradient(160deg, rgba(38,38,44,.85), rgba(20,20,24,.9));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -18px rgba(0,0,0,.9);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, box-shadow .35s;
}
.song-card:hover{
  transform:translateY(-5px);
  border-color:rgba(250,35,59,.35);
  box-shadow:0 24px 40px -20px rgba(0,0,0,.9), 0 0 24px -6px rgba(250,35,59,.25);
}
.song-card.playing{
  border-color:rgba(250,35,59,.6);
  box-shadow:0 0 0 1px rgba(250,35,59,.4), 0 20px 40px -18px rgba(250,35,59,.35);
}
.song-card.playing .card-title{ color:#ff5c72; }
.eq{ display:inline-flex; align-items:flex-end; gap:2px; height:12px; }
.eq span{ width:3px; border-radius:1px; background:#fff; animation:eq .9s ease-in-out infinite; }
.eq span:nth-child(2){ animation-delay:.25s; }
.eq span:nth-child(3){ animation-delay:.5s; }
@keyframes eq{ 0%,100%{height:4px;} 50%{height:12px;} }
.paused .eq span{ animation-play-state:paused; height:5px; }
.chip{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  color:#c9c9ce;
  transition:all .25s;
}
.chip:hover{ background:rgba(255,255,255,.08); color:#fff; }
.chip.on{
  background:linear-gradient(135deg,#ff2d55,#fa233b);
  border-color:transparent;
  color:#fff;
  box-shadow:0 8px 20px -8px rgba(250,35,59,.6);
}
.btn-ghost{ color:#8e8e93; transition:color .2s, transform .2s; }
.btn-ghost:hover{ color:#fff; }
.btn-ghost:active{ transform:scale(.9); }
.play-fab{
  background:linear-gradient(135deg,#ff2d55,#fa233b);
  box-shadow:0 10px 24px -8px rgba(250,35,59,.7);
  transition:transform .2s, filter .2s;
}
.play-fab:hover{ transform:scale(1.07); filter:brightness(1.1); }
.play-fab:active{ transform:scale(.95); }
.skeleton{
  animation:pulse 1.4s infinite ease-in-out;
  background:linear-gradient(90deg,#17171a 25%,#26262c 50%,#17171a 75%);
  background-size:200% 100%;
}
@keyframes pulse{ 0%,100%{opacity:.45;} 50%{opacity:.85;} }
.grad-text{
  background:linear-gradient(120deg,#ff6b81,#ff2d55 45%,#fa233b);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
#progressTrack{ position:relative; }
#progressBar{ transition:width .12s linear; }
#progressTrack:hover #progressBar{ background:#ff5c72; }
.upto{ animation:slideUp .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideUp{ from{ transform:translateY(14px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
select#entitySelect{
  -webkit-appearance:none; appearance:none;
  background-color:rgba(0,0,0,.5);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:right .5rem center;
  background-size:1em;
}
select#entitySelect option{ background:#161618; color:#f5f5f7; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:#0b0b0d; }
::-webkit-scrollbar-thumb{ background:#2a2a30; border-radius:5px; border:2px solid #0b0b0d; }
::-webkit-scrollbar-thumb:hover{ background:#fa233b; }
</style>
</head>
<body class="flex flex-col pb-32">

<header class="sticky top-0 z-40 nav-blur px-4 lg:px-8 py-4">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3 cursor-pointer select-none" onclick="handleTagClick('Parting Time')">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-red to-brand-pink flex items-center justify-center shadow-lg shadow-brand-pink/40 relative">
        <i class="fa-solid fa-music text-white text-lg"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-xl tracking-tight leading-none flex items-center gap-1.5">
          Apple Music <span class="text-[10px] px-2 py-0.5 rounded-full bg-brand-pink/15 text-brand-pink border border-brand-pink/30 font-bold uppercase tracking-wider">Finder</span>
        </h1>
        <p class="text-[11px] text-gray-500 mt-1 tracking-wide">Explore songs, previews & iTunes metadata</p>
      </div>
    </div>
    <form id="searchForm" class="w-full md:w-1/2 max-w-xl relative flex items-center">
      <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-500 text-sm"></i>
      <select id="entitySelect" class="absolute right-[100px] bg-transparent text-[11px] text-gray-300 font-semibold border border-white/10 rounded-full px-3 py-1.5 pr-7 cursor-pointer focus:outline-none hover:border-brand-pink/50 transition-colors">
        <option value="song">Songs</option>
        <option value="album">Albums</option>
        <option value="musicArtist">Artists</option>
        <option value="musicVideo">Music Videos</option>
        <option value="musicTrack">Tracks + Videos</option>
        <option value="mix">DJ Mixes</option>
      </select>
      <input id="searchInput" type="text" autocomplete="off" placeholder="Search songs, artists, albums…"
        class="w-full bg-black/50 border border-white/10 text-sm rounded-full pl-11 pr-[190px] py-3 text-white placeholder-gray-600 focus:outline-none focus:border-brand-pink/60 focus:ring-2 focus:ring-brand-pink/25 transition-all duration-300">
      <button type="submit" class="absolute right-1.5 bg-gradient-to-r from-brand-red to-brand-pink text-white font-semibold text-xs px-5 py-2 rounded-full shadow-md shadow-brand-pink/25 hover:brightness-110 active:scale-95 transition-all">Search</button>
    </form>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 lg:px-8 w-full mt-8 flex-1">
  <section class="mb-8">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-[11px] font-bold text-gray-500 uppercase tracking-[.15em]">Quick Queries</span>
      <span class="h-px flex-1 bg-white/5"></span>
    </div>
    <div class="flex flex-wrap items-center gap-2" id="chipContainer">
      <button data-tag="Parting Time" onclick="handleTagClick('Parting Time')" class="chip on px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-compact-disc mr-1.5"></i>Parting Time</button>
      <button data-tag="Radio Stations" onclick="handleTagClick('Radio Stations')" class="chip px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-radio mr-1.5"></i>Radio Hits</button>
      <button data-tag="New Music" onclick="handleTagClick('New Music')" class="chip px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-bolt mr-1.5"></i>New Music</button>
      <button data-tag="Taylor Swift" onclick="handleTagClick('Taylor Swift')" class="chip px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-star mr-1.5"></i>Taylor Swift</button>
      <button data-tag="K-Pop" onclick="handleTagClick('K-Pop')" class="chip px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-fire mr-1.5"></i>K-Pop</button>
      <button data-tag="Rock" onclick="handleTagClick('Rock')" class="chip px-4 py-2 rounded-full text-xs font-semibold"><i class="fa-solid fa-guitar mr-1.5"></i>Rock Classics</button>
    </div>
  </section>

  <div class="flex items-center justify-between mb-6 pb-3 border-b border-white/5">
    <h2 id="searchHeading" class="text-lg md:text-xl font-bold tracking-tight">
      Showing results for “<span class="grad-text" id="queryText">Parting Time</span>”
    </h2>
    <span id="resultCount" class="text-[11px] text-gray-400 font-semibold bg-white/5 px-3 py-1.5 rounded-full border border-white/5">0 results</span>
  </div>

  <div id="skeletonGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
    <script>
      document.write(Array(8).fill(0).map(() =>
        '<div class="song-card rounded-2xl p-4"><div class="w-full aspect-square rounded-xl skeleton mb-4"></div><div class="h-4 w-3/4 rounded-md skeleton mb-2"></div><div class="h-3 w-1/2 rounded-md skeleton"></div></div>'
      ).join(''));
    </script>
  </div>

  <div id="resultsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 hidden"></div>

  <div id="emptyState" class="hidden flex-col items-center justify-center py-24 text-center">
    <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center text-3xl text-gray-600 mb-5 border border-white/5">
      <i class="fa-solid fa-record-vinyl"></i>
    </div>
    <h3 class="text-lg font-bold text-white mb-1">No results found</h3>
    <p class="text-sm text-gray-500 max-w-sm">We couldn't find anything matching your search. Try a different term or category.</p>
  </div>

  <section id="albumView" class="hidden">
    <button onclick="closeAlbumView()" class="btn-ghost text-xs font-semibold mb-6 flex items-center gap-2"><i class="fa-solid fa-chevron-left"></i> Back to results</button>
    <div class="flex flex-col md:flex-row gap-6 md:gap-8 mb-8">
      <img id="albumArt" src="" alt="" class="w-44 h-44 md:w-60 md:h-60 rounded-2xl object-cover border border-white/10 shadow-2xl shadow-black/60 bg-black/40">
      <div class="flex flex-col justify-end min-w-0">
        <span id="albumKind" class="text-[10px] font-bold uppercase tracking-widest text-brand-pink mb-2">Album</span>
        <h2 id="albumName" class="text-2xl md:text-4xl font-extrabold tracking-tight leading-tight mb-2 truncate">—</h2>
        <p id="albumArtist" class="text-sm md:text-base text-gray-300 font-medium mb-3 truncate">—</p>
        <p id="albumMeta" class="text-xs text-gray-500 mb-5">—</p>
        <div class="flex items-center gap-3">
          <button onclick="playAlbum()" id="albumPlayBtn" class="bg-gradient-to-r from-brand-red to-brand-pink text-white font-bold text-sm px-6 py-3 rounded-full shadow-lg shadow-brand-pink/30 hover:brightness-110 active:scale-95 transition-all">
            <i class="fa-solid fa-play mr-2 text-xs"></i>Preview
          </button>
          <a id="albumLink" href="#" target="_blank" class="chip px-5 py-3 rounded-full text-xs font-semibold no-underline"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>Apple Music</a>
        </div>
      </div>
    </div>
    <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-[.15em] mb-4">Tracks</h3>
    <div id="albumTracks" class="flex flex-col gap-1"></div>
  </section>
</main>

<footer id="playerBar" class="fixed bottom-0 left-0 right-0 z-50 nav-blur border-t border-white/8 p-3 md:px-8 translate-y-full transition-transform duration-500">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 w-[30%] min-w-0">
      <img id="playerArtwork" src="" alt="" class="w-12 h-12 rounded-lg object-cover border border-white/10 shadow-lg bg-black/40">
      <div class="min-w-0">
        <h4 id="playerTrackName" class="font-semibold text-sm text-white truncate">—</h4>
        <p id="playerArtistName" class="text-[11px] text-gray-400 truncate">—</p>
      </div>
    </div>

    <div class="flex flex-col items-center w-[40%] max-w-md">
      <div class="flex items-center gap-5 mb-1.5">
        <button onclick="shuffleMode()" id="shuffleBtn" class="btn-ghost text-xs" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
        <button onclick="playPrev()" class="btn-ghost text-xs" title="Previous"><i class="fa-solid fa-backward-step text-base"></i></button>
        <button onclick="togglePlayPause()" class="play-fab w-11 h-11 rounded-full text-white flex items-center justify-center">
          <i id="mainPlayIcon" class="fa-solid fa-play text-sm translate-x-0.5"></i>
        </button>
        <button onclick="playNext()" class="btn-ghost text-xs" title="Play next"><i class="fa-solid fa-forward-step text-base"></i></button>
        <button onclick="repeatMode()" id="repeatBtn" class="btn-ghost text-xs" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="w-full flex items-center gap-2">
        <span id="currentTime" class="text-[10px] text-gray-500 w-9 text-right font-mono">0:00</span>
        <div id="progressTrack" class="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event)">
          <div id="progressBar" class="h-full bg-gradient-to-r from-brand-red to-brand-pink w-0 rounded-full"></div>
        </div>
        <span id="durationTime" class="text-[10px] text-gray-500 w-9 font-mono">0:30</span>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 w-[30%]">
      <span id="upNextLabel" class="hidden lg:block text-[10px] text-gray-500 truncate max-w-[180px]"></span>
      <a id="playerAppleLink" href="#" target="_blank" class="hidden md:flex items-center gap-1.5 text-[11px] text-brand-pink font-semibold bg-brand-pink/10 px-3 py-1.5 rounded-full border border-brand-pink/20 hover:bg-brand-pink/20 transition-colors">
        <span>Apple Music</span><i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
      </a>
      <button onclick="closePlayer()" class="btn-ghost p-2" title="Close"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
  </div>
</footer>

<audio id="globalAudio" class="hidden" preload="auto"></audio>

<script>
const searchForm = document.getElementById('searchForm');
const searchInput = document.getElementById('searchInput');
const entitySelect = document.getElementById('entitySelect');
const queryText = document.getElementById('queryText');
const resultCount = document.getElementById('resultCount');
const skeletonGrid = document.getElementById('skeletonGrid');
const resultsGrid = document.getElementById('resultsGrid');
const emptyState = document.getElementById('emptyState');
const playerBar = document.getElementById('playerBar');
const playerArtwork = document.getElementById('playerArtwork');
const playerTrackName = document.getElementById('playerTrackName');
const playerArtistName = document.getElementById('playerArtistName');
const playerAppleLink = document.getElementById('playerAppleLink');
const upNextLabel = document.getElementById('upNextLabel');
const globalAudio = document.getElementById('globalAudio');
const mainPlayIcon = document.getElementById('mainPlayIcon');
const progressBar = document.getElementById('progressBar');
const progressTrack = document.getElementById('progressTrack');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const shuffleBtn = document.getElementById('shuffleBtn');
const repeatBtn = document.getElementById('repeatBtn');
const albumView = document.getElementById('albumView');
const albumArt = document.getElementById('albumArt');
const albumName = document.getElementById('albumName');
const albumArtist = document.getElementById('albumArtist');
const albumMeta = document.getElementById('albumMeta');
const albumKind = document.getElementById('albumKind');
const albumLink = document.getElementById('albumLink');
const albumTracksEl = document.getElementById('albumTracks');

const ENTITY_LABEL = {
  song: 'Songs',
  album: 'Albums',
  musicArtist: 'Artists',
  musicVideo: 'Music Videos',
  musicTrack: 'Tracks + Videos',
  mix: 'DJ Mixes'
};

let songList = [];
let playQueue = [];
let albumTracks = [];
let currentAlbum = null;
let currentTrackId = null;
let isShuffle = false;
let isRepeat = false;

document.addEventListener('DOMContentLoaded', () => fetchSongs('Parting Time', 'song'));

searchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const term = searchInput.value.trim();
  if (term) fetchSongs(term, entitySelect.value);
});

entitySelect.addEventListener('change', () => {
  const term = searchInput.value.trim() || queryText.textContent;
  fetchSongs(term, entitySelect.value);
});

function handleTagClick(term) {
  searchInput.value = term;
  setChip(term);
  fetchSongs(term, entitySelect.value);
}

function setChip(activeTerm) {
  document.querySelectorAll('.chip').forEach(chip => {
    chip.classList.toggle('on', (chip.dataset.tag || '').toLowerCase() === activeTerm.toLowerCase());
  });
}

async function fetchSongs(term, entity) {
  queryText.textContent = `${term} · ${ENTITY_LABEL[entity] || entity}`;
  skeletonGrid.classList.remove('hidden');
  resultsGrid.classList.add('hidden');
  emptyState.classList.add('hidden');
  albumView.classList.add('hidden');
  try {
    const res = await fetch(`https://itunes.apple.com/search?media=music&term=${encodeURIComponent(term)}&entity=${entity}&limit=24`);
    if (!res.ok) throw new Error('request failed');
    const data = await res.json();
    songList = (data.results || []).map(t => ({
      ...t,
      _id: t.trackId ?? t.collectionId ?? t.artistId ?? Math.random(),
      _name: t.trackName || t.collectionName || t.artistName || 'Untitled',
      _preview: !!t.previewUrl,
      _url: t.trackViewUrl || t.collectionViewUrl || t.artistViewUrl || '#'
    }));
    playQueue = songList.filter(t => t._preview);
    renderSongs();
  } catch (err) {
    songList = [];
    renderSongs();
  } finally {
    skeletonGrid.classList.add('hidden');
  }
}

function hiRes(url, size) {
  if (!url) return '';
  return url.replace(/\/\d+x\d+bb/, `/${size}`);
}

function renderSongs() {
  resultsGrid.innerHTML = '';
  resultCount.textContent = `${songList.length} results`;
  if (!songList.length) {
    emptyState.classList.remove('hidden');
    emptyState.classList.add('flex');
    return;
  }
  emptyState.classList.add('hidden');
  emptyState.classList.remove('flex');
  resultsGrid.classList.remove('hidden');
  songList.forEach((track, i) => {
    const art = hiRes(track.artworkUrl100 || track.artworkUrl60, '600x600bb');
    const year = track.releaseDate ? new Date(track.releaseDate).getFullYear() : '—';
    const kindLabel = (track.wrapperType === 'artist' ? 'Artist' : track.kind || 'Music').replace(/([A-Z])/g, ' $1').trim();
    const isVideo = track.kind === 'music-video';
    const sub2 = track.collectionName || track.primaryGenreName || '';
    const isCur = currentTrackId === track._id;
    const isAlbum = track.wrapperType === 'collection';
    const playBtn = track._preview
      ? `<button onclick="event.stopPropagation();playTrack(${track._id})" class="play-fab w-12 h-12 rounded-full text-white flex items-center justify-center opacity-95"><i id="cardPlayIcon-${track._id}" class="fa-solid fa-play text-lg translate-x-0.5"></i></button>`
      : (isAlbum
        ? `<button onclick="event.stopPropagation();openAlbum(${track._id})" class="play-fab w-12 h-12 rounded-full text-white flex items-center justify-center opacity-95"><i class="fa-solid fa-arrow-up-right-from-square text-base"></i></button>`
        : `<a href="${track._url}" target="_blank" onclick="event.stopPropagation()" class="w-12 h-12 rounded-full bg-white/90 text-black flex items-center justify-center opacity-95 hover:bg-white transition"><i class="fa-solid fa-arrow-up-right-from-square text-base"></i></a>`);
    const nextBtn = track._preview
      ? `<button onclick="event.stopPropagation();playTrack(${songList[i + 1] && songList[i + 1]._preview ? songList[i + 1]._id : track._id})" class="btn-ghost text-[11px]" title="Play next"><i class="fa-solid fa-forward-step"></i></button>`
      : '';
    const card = `
      <div ${isAlbum ? `onclick="openAlbum(${track._id})"` : ''} class="song-card rounded-2xl p-4 flex flex-col upto ${isCur ? 'playing' : ''} ${isAlbum ? 'cursor-pointer' : ''}" style="animation-delay:${Math.min(i * 40, 400)}ms" data-id="${track._id}">
        <div class="relative w-full aspect-square rounded-xl overflow-hidden mb-3 bg-black/50 group">
          <img src="${art}" alt="${esc(track._name)}" loading="lazy" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/45 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
            ${playBtn}
          </div>
          <span class="absolute top-2 left-2 text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-black/65 text-gray-200 border border-white/10">${esc(kindLabel)}</span>
          ${isVideo ? '<span class="absolute top-2 right-2 text-[9px] font-bold px-2 py-0.5 rounded-md bg-brand-pink text-white"><i class="fa-solid fa-video text-[8px] mr-1"></i>Video</span>' : ''}
          ${track.trackCount ? `<span class="absolute bottom-2 right-2 text-[9px] font-bold px-2 py-0.5 rounded-md bg-black/65 text-gray-200 border border-white/10">${track.trackCount} tracks</span>` : ''}
          ${isCur ? '<span class="absolute bottom-2 left-2 flex items-center gap-1.5 text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-brand-pink/90 text-white" id="nowBadge"><span class="eq"><span></span><span></span><span></span></span>Now Playing</span>' : ''}
        </div>
        <h3 class="card-title font-bold text-sm text-white truncate leading-snug transition-colors" title="${esc(track._name)}">${esc(track._name)}</h3>
        <p class="text-[11px] text-gray-400 truncate mt-0.5" title="${esc(track.artistName || track.genre || '')}">${esc(track.artistName || track.genre || '')}</p>
        ${sub2 ? `<p class="text-[10px] text-gray-600 truncate mt-0.5" title="${esc(sub2)}">${esc(sub2)}</p>` : ''}
        <div class="pt-2.5 mt-2.5 border-t border-white/5 flex items-center justify-between">
          <span class="text-[10px] font-mono text-gray-500">${year}</span>
          <div class="flex items-center gap-3">
            ${nextBtn}
            <a href="${track._url}" target="_blank" class="btn-ghost text-[11px]" title="Open in iTunes"><i class="fa-solid fa-external-link"></i></a>
          </div>
        </div>
      </div>`;
    resultsGrid.insertAdjacentHTML('beforeend', card);
  });
  syncAllIcons();
  updateUpNext();
}

function currentIndex() {
  return songList.findIndex(s => s._id === currentTrackId);
}

function loadTrack(track) {
  if (!track._preview) return;
  currentTrackId = track._id;
  globalAudio.src = track.previewUrl;
  globalAudio.play().catch(() => {});
  playerArtwork.src = hiRes(track.artworkUrl100, '300x300bb');
  playerTrackName.textContent = track._name;
  playerArtistName.textContent = track.artistName || '';
  playerAppleLink.href = track._url;
  playerBar.classList.remove('translate-y-full');
  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('playing'));
  const card = resultsGrid.querySelector(`.song-card[data-id="${track._id}"]`);
  if (card) card.classList.add('playing');
  syncAllIcons();
  updateUpNext();
  if (!albumView.classList.contains('hidden')) renderAlbumTracks();
}

function playTrack(trackId) {
  const track = playQueue.find(s => s._id === trackId) || songList.find(s => s._id === trackId) || albumTracks.find(s => s._id === trackId);
  if (!track) return;
  if (playQueue.every(s => s._id !== trackId)) {
    playQueue = (albumTracks.some(s => s._id === trackId) ? albumTracks : songList).filter(s => s._preview);
  }
  if (currentTrackId === trackId) {
    togglePlayPause();
    return;
  }
  loadTrack(track);
}

async function openAlbum(collectionId) {
  const album = songList.find(s => s._id === collectionId && s.wrapperType === 'collection');
  if (!album) return;
  currentAlbum = album;
  albumArt.src = hiRes(album.artworkUrl100, '600x600bb');
  albumName.textContent = album._name;
  albumArtist.textContent = album.artistName || 'Various Artists';
  albumKind.textContent = album.collectionType === 'Album' ? 'Album' : (album.collectionType || 'Album');
  const year = album.releaseDate ? new Date(album.releaseDate).getFullYear() : '';
  albumMeta.textContent = [album.primaryGenreName, year, album.trackCount ? `${album.trackCount} songs` : ''].filter(Boolean).join(' · ') || '—';
  albumLink.href = album._url;
  albumTracksEl.innerHTML = '<div class="h-4 w-2/3 rounded-md skeleton mb-3"></div><div class="h-4 w-1/2 rounded-md skeleton mb-3"></div><div class="h-4 w-3/5 rounded-md skeleton mb-3"></div>';
  resultsGrid.classList.add('hidden');
  emptyState.classList.add('hidden');
  albumView.classList.remove('hidden');
  albumTracksEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  try {
    const res = await fetch(`https://itunes.apple.com/lookup?id=${collectionId}&entity=song&limit=100`);
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    albumTracks = (data.results || []).filter(t => t.wrapperType === 'track' && t.previewUrl).map(t => ({
      ...t,
      _id: t.trackId,
      _name: t.trackName,
      _preview: true,
      _url: t.trackViewUrl || '#'
    }));
  } catch (err) {
    albumTracks = [];
  }
  renderAlbumTracks();
}

function renderAlbumTracks() {
  albumTracksEl.innerHTML = '';
  if (!albumTracks.length) {
    albumTracksEl.innerHTML = '<p class="text-xs text-gray-600 py-4">No preview tracks available for this album.</p>';
    return;
  }
  albumTracks.forEach((t, i) => {
    const isCur = currentTrackId === t._id;
    const row = `
      <div onclick="playTrack(${t._id})" class="group flex items-center gap-4 px-3 py-2.5 rounded-xl cursor-pointer hover:bg-white/5 transition-colors ${isCur ? 'bg-brand-pink/10' : ''}">
        <span class="text-[11px] font-mono text-gray-500 w-5 text-center group-hover:hidden">${isCur ? '<span class="eq"><span></span><span></span><span></span></span>' : i + 1}</span>
        <span class="w-5 text-center hidden group-hover:block"><i class="fa-solid ${isCur && !globalAudio.paused ? 'fa-pause' : 'fa-play'} text-[11px] text-white"></i></span>
        <span class="w-9 h-9 rounded-md overflow-hidden border border-white/10 flex-shrink-0"><img src="${hiRes(t.artworkUrl100, '200x200bb')}" alt="" class="w-full h-full object-cover"></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold truncate ${isCur ? 'text-brand-pink' : 'text-white'}">${esc(t._name)}</p>
          <p class="text-[11px] text-gray-500 truncate">${esc(t.artistName)}</p>
        </div>
        <span class="text-[10px] font-mono text-gray-600">${t.trackTimeMillis ? fmt(t.trackTimeMillis / 1000) : '—'}</span>
        <a href="${t._url}" target="_blank" onclick="event.stopPropagation()" class="btn-ghost text-[11px]"><i class="fa-solid fa-external-link"></i></a>
      </div>`;
    albumTracksEl.insertAdjacentHTML('beforeend', row);
  });
}

function playAlbum() {
  if (albumTracks.length) {
    playQueue = albumTracks;
    loadTrack(albumTracks[0]);
  }
}

function closeAlbumView() {
  albumView.classList.add('hidden');
  resultsGrid.classList.remove('hidden');
}

function togglePlayPause() {
  if (!currentTrackId) {
    if (songList.length) loadTrack(songList[0]);
    return;
  }
  if (globalAudio.paused) {
    globalAudio.play().catch(() => {});
    syncAllIcons();
  } else {
    globalAudio.pause();
    syncAllIcons();
  }
}

function playNext() {
  if (!playQueue.length) return;
  const idx = playQueue.findIndex(s => s._id === currentTrackId);
  let nextIdx;
  if (isShuffle) {
    nextIdx = Math.floor(Math.random() * playQueue.length);
    if (playQueue.length > 1 && nextIdx === idx) nextIdx = (nextIdx + 1) % playQueue.length;
  } else {
    nextIdx = idx < 0 ? 0 : (idx + 1) % playQueue.length;
  }
  loadTrack(playQueue[nextIdx]);
}

function playPrev() {
  if (!playQueue.length) return;
  const idx = playQueue.findIndex(s => s._id === currentTrackId);
  if (idx > 0 && globalAudio.currentTime > 3) {
    globalAudio.currentTime = 0;
    return;
  }
  const prevIdx = idx <= 0 ? playQueue.length - 1 : idx - 1;
  loadTrack(playQueue[prevIdx]);
}

function shuffleMode() {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle('text-brand-pink', isShuffle);
  shuffleBtn.classList.toggle('btn-ghost', !isShuffle);
}

function repeatMode() {
  isRepeat = !isRepeat;
  repeatBtn.classList.toggle('text-brand-pink', isRepeat);
  repeatBtn.classList.toggle('btn-ghost', !isRepeat);
  globalAudio.loop = isRepeat;
}

function updateUpNext() {
  const idx = playQueue.findIndex(s => s._id === currentTrackId);
  const next = playQueue[(idx + 1) % playQueue.length];
  if (next && idx >= 0) {
    upNextLabel.textContent = `Up next: ${next._name} · ${next.artistName || ''}`;
  } else {
    upNextLabel.textContent = '';
  }
}

function syncAllIcons() {
  const playing = currentTrackId !== null && !globalAudio.paused;
  mainPlayIcon.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'} text-sm ${playing ? '' : 'translate-x-0.5'}`;
  document.querySelectorAll('[id^="cardPlayIcon-"]').forEach(icon => {
    icon.className = 'fa-solid fa-play text-lg translate-x-0.5';
  });
  const badge = document.getElementById('nowBadge');
  if (badge) {
    if (playing) badge.classList.remove('paused');
    else badge.classList.add('paused');
  }
  if (currentTrackId !== null) {
    const icon = document.getElementById(`cardPlayIcon-${currentTrackId}`);
    if (icon) icon.className = `fa-solid ${playing ? 'fa-pause' : 'fa-play'} text-lg ${playing ? '' : 'translate-x-0.5'}`;
  }
}

function closePlayer() {
  globalAudio.pause();
  currentTrackId = null;
  playerBar.classList.add('translate-y-full');
  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('playing'));
  syncAllIcons();
}

globalAudio.addEventListener('timeupdate', () => {
  if (!globalAudio.duration) return;
  progressBar.style.width = `${(globalAudio.currentTime / globalAudio.duration) * 100}%`;
  currentTimeEl.textContent = fmt(globalAudio.currentTime);
  durationTimeEl.textContent = fmt(globalAudio.duration);
});

globalAudio.addEventListener('play', syncAllIcons);
globalAudio.addEventListener('pause', syncAllIcons);
globalAudio.addEventListener('ended', () => {
  if (isRepeat) return;
  progressBar.style.width = '0%';
  playNext();
});

function seekAudio(e) {
  if (!globalAudio.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  globalAudio.currentTime = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1) * globalAudio.duration;
}

function fmt(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}

function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
</script>
